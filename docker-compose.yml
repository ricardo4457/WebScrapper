services:
  # Base de dados Redis (Fila)
  redis:
    image: redis:alpine
    container_name: redis
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - scraper-network
    deploy:
      resources:
        limits:
          memory: 600m

  # Painel de Controlo do Redis
  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - "5540:5540"
    networks:
      - scraper-network
    depends_on:
      - redis

  # A tua API Express
  scraper-api:
    build: .
    container_name: scraper-api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - scraper-network
    depends_on:
      - redis

  # O teu Worker dedicado (jobRunner) - corre Playwright, precisa de mais RAM/CPU e /dev/shm maior
  scraper-worker:
    build: .
    container_name: scraper-worker
    tty: true
    command: ["node", "src/runner/JobRunner.js"]
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SCRAPER_HEADLESS=true
    # Permite ao container resolver host.docker.internal -> máquina host,
    # necessário para o callback do worker alcançar o Laravel a correr fora
    # do Docker (php artisan serve / Valet / Herd na porta 8000).
    # host-gateway funciona em Linux (Docker 20.10+); Mac/Windows já
    # resolvem host.docker.internal nativamente mesmo sem isto, mas fica
    # explícito e sem custo.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: '1gb'
    ipc: host
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules # Prevents local node_modules from overwriting container modules
    networks:
      - scraper-network
    depends_on:
      - redis

networks:
  scraper-network:
    driver: bridge

volumes:
  redis-data: